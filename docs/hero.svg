<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Wiretap — See who is talking</title>
  <desc id="desc">A dark product card with the Wiretap mark and a live panel of apps talking on the internet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161e"/>
      <stop offset="0.58" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f7768e" stop-opacity=".05"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7aa2f7" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="190" cy="120" r="210" fill="url(#glow)"/>

  <g transform="translate(82 76)">
    <circle cx="47" cy="47" r="46" fill="#24283b" stroke="#7aa2f7" stroke-width="2"/>
    <g fill="none" stroke-linecap="round">
      <path d="M22 47h50" stroke="#c0caf5" stroke-width="5"/>
      <path d="M22 57h50" stroke="#c0caf5" stroke-opacity=".35" stroke-width="5"/>
      <path d="M47 22v25" stroke="#7aa2f7" stroke-width="5"/>
    </g>
    <circle cx="47" cy="47" r="5" fill="#7aa2f7"/>

    <text x="0" y="152" fill="#7aa2f7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="4">OMARCHY PLUGIN</text>
    <text x="0" y="205" fill="#c0caf5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="750">Wiretap</text>
    <text x="1" y="245" fill="#7aa2f7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" letter-spacing="2">SEE WHO IS TALKING</text>
    <text x="1" y="285" fill="#a9b1d6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">Every connection, grouped by the app that owns it.</text>
  </g>

  <g transform="translate(620 48)" filter="url(#shadow)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="496" height="324" rx="14" fill="#16161e" stroke="#565f89"/>
    <rect x="1" y="1" width="494" height="72" rx="13" fill="#1f2335"/>
    <rect x="1" y="1" width="6" height="72" rx="3" fill="#7aa2f7"/>
    <circle cx="42" cy="37" r="18" fill="#24283b" stroke="#7aa2f7"/>
    <path d="M32 37h20" fill="none" stroke="#c0caf5" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M42 26v11" fill="none" stroke="#7aa2f7" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="42" cy="37" r="2.4" fill="#7aa2f7"/>
    <text x="72" y="30" fill="#c0caf5" font-size="15" font-weight="700">Wiretap</text>
    <text x="72" y="50" fill="#7aa2f7" font-size="10" font-weight="700">2 apps talking · 1 waiting</text>

    <rect x="20" y="88" width="456" height="54" rx="8" fill="#1a2238" stroke="#7aa2f7" stroke-opacity=".4"/>
    <rect x="20" y="88" width="5" height="54" rx="2" fill="#7aa2f7"/>
    <text x="42" y="112" fill="#c0caf5" font-size="14" font-weight="700">ChatGPT</text>
    <text x="42" y="130" fill="#565f89" font-size="10">4 connections</text>
    <text x="42" y="168" fill="#7aa2f7" font-size="13">https → 140.82.113.25</text>
    <text x="42" y="186" fill="#565f89" font-size="10">on the internet</text>

    <rect x="20" y="206" width="456" height="54" rx="8" fill="#2a1d24" stroke="#f7768e" stroke-opacity=".45"/>
    <rect x="20" y="206" width="5" height="54" rx="2" fill="#f7768e"/>
    <text x="42" y="230" fill="#c0caf5" font-size="14" font-weight="700">dropbox</text>
    <text x="42" y="248" fill="#f7768e" font-size="12">Open to the world on port 17500</text>

    <text x="248" y="300" text-anchor="middle" fill="#7aa2f7" font-size="10" font-weight="700" letter-spacing="1.6">THEME-AWARE · APP FIRST</text>
  </g>
</svg>
